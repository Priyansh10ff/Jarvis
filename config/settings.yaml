# Shared defaults. Put machine-specific values in config/settings.local.yaml (gitignored).

assistant:
  name: Jarvis          # change here to rename the assistant everywhere

user:
  name: Priyansh

startup:
  greet: true
  delay_seconds: 8      # wait after logon so the desktop and audio are ready

voice:
  tts_rate: 175         # words per minute

wake:
  model: hey_jarvis     # pretrained openWakeWord model; custom name needs a trained model
  threshold: 0.5        # 0-1, higher = fewer false wakes, lower = easier to trigger
  cooldown_seconds: 2   # ignore repeat triggers right after a wake
  acknowledgements: ["Yes?", "I'm listening.", "Go ahead."]

awake:
  followup_seconds: 8        # keep listening this long after a reply, no wake word needed
  sleep_phrases: ["go to sleep", "sleep", "that's all", "stop listening", "never mind"]
  echo_transcript: true      # say back what was heard (testing until the brain exists)

listen:
  start_timeout_seconds: 5   # give up if you don't start talking within this time
  end_silence_ms: 800        # this much silence ends your sentence
  max_seconds: 15
  vad_aggressiveness: 2      # 0-3, higher filters more background noise

stt:
  model: large-v3-turbo      # or distil-large-v3, small.en for slower PCs
  device: auto               # auto | cuda | cpu
  language: null             # null = auto-detect (Hinglish ok), or "en"
  beam_size: 1               # 1 = fastest, 5 = slightly more accurate

logging:
  level: INFO
  file: logs/jarvis.log
