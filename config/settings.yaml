# Shared defaults. Put machine-specific values in config/settings.local.yaml (gitignored).

assistant:
  name: Jarvis          # change here to rename the assistant everywhere

user:
  name: Priyansh

startup:
  greet: true
  delay_seconds: 8      # wait after logon so the desktop and audio are ready

voice:
  tts_rate: 175         # words per minute

wake:
  model: hey_jarvis     # pretrained openWakeWord model; custom name needs a trained model
  threshold: 0.5        # 0-1, higher = fewer false wakes, lower = easier to trigger
  cooldown_seconds: 2   # ignore repeat triggers right after a wake
  acknowledgements: ["Yes?", "I'm listening.", "Go ahead."]

awake:
  followup_seconds: 8        # keep listening this long after a reply, no wake word needed
  sleep_phrases: ["go to sleep", "sleep", "that's all", "stop listening", "never mind", "stop", "jarvis stop"]

listen:
  start_timeout_seconds: 5   # give up if you don't start talking within this time
  end_silence_ms: 800        # this much silence ends your sentence
  max_seconds: 15
  vad_aggressiveness: 2      # 0-3, higher filters more background noise

stt:
  model: large-v3-turbo      # or distil-large-v3, small.en for slower PCs
  device: auto               # auto | cuda | cpu
  language: null             # null = auto-detect (Hinglish ok), or "en"
  beam_size: 1               # 1 = fastest, 5 = slightly more accurate

logging:
  level: INFO
  file: logs/jarvis.log

brain:
  order: [groq, claude, local]   # tried in this order; missing keys or errors fall through
  max_tokens: 300
  timeout_seconds: 20
  max_tool_steps: 5              # tool calls allowed per request
  history_turns: 10              # past exchanges kept for follow-ups
  history_reset_minutes: 10      # forget the conversation after this long idle
  providers:
    groq:
      model: llama-3.3-70b-versatile
    claude:
      model: claude-haiku-5-5    # claude-sonnet-5-5 for harder questions
    local:
      model: llama3.1:8b         # any model pulled in Ollama
      base_url: http://localhost:11434/v1

typing:
  notch: true                 # thin pill at the top-center; hover it to open the bar
  notch_hover_ms: 150         # how long the mouse must rest on the notch before it opens
  hotkey: ctrl+alt+j          # also opens the bar; modifiers: ctrl, alt, shift, win
  stop_hotkey: ctrl+alt+k     # kill switch: stop talking, cancel pending action, sleep
  hide_on_focus_loss: true

security:
  max_tool_calls_per_minute: 20  # stops a runaway model loop
  redact_cloud: true             # scrub keys, card numbers, passwords before text goes to Groq/Claude
  blocked_domains: []            # e.g. ["example-bank.com"]; Jarvis will refuse to open them
  levels: {}                     # make a tool stricter, e.g. {screenshot: confirm, open_website: deny}
  audit_file: logs/audit.jsonl

overlay:
  enabled: true
  position: bottom-right   # bottom-right | bottom-center | center
  size: 220                # orb area in pixels
  show_captions: true      # show what was heard and the reply under the orb
