# Shared defaults. Put machine-specific values in config/settings.local.yaml (gitignored).

assistant:
  name: Jarvis          # change here to rename the assistant everywhere

user:
  name: Priyansh

startup:
  greet: true
  delay_seconds: 8      # wait after logon so the desktop and audio are ready

voice:
  tts_rate: 175         # words per minute
  voice: female         # female | male | part of a voice name (python -m voice.tts --list)

audio:
  input_device: null    # null = Windows default mic; or a number / part of the name (python -m voice.wakeword --list)
  gain: 1.0             # raise to 2-3 if your mic is quiet

wake:
  mode: phrase          # always = no wake word, any command ("open chrome", "what's the time") is acted on
                        # phrase = only after "hey"; model = "hey jarvis" wake word model
  phrases: ["hey", "hay", "hei"]   # first word that wakes it; "hey, open spotify" works in one go
  soft_phrases: ["he", "a", "hi", "eh", "ay"]   # mishearings of "hey", only accepted before a command
  command_starts: [open, close, search, google, play, pause, stop, next, previous, take, lock, shut,
                   restart, turn, set, volume, mute, what, whats, who, when, where, why, how, tell,
                   show, find, start, launch, check, type, write, create, make, go, can, could]
                   # in "always" mode, only sentences starting with one of these are acted on
  model: hey_jarvis     # used when mode: model
  threshold: 0.35       # 0-1, higher = fewer false wakes, lower = easier to trigger
  cooldown_seconds: 2   # ignore repeat triggers right after a wake
  acknowledgements: ["Yes?", "I'm listening.", "Go ahead."]

awake:
  followup_seconds: 20       # keep listening this long after a reply, no wake word needed
  grace_seconds: 60          # after it sleeps, commands like "open chrome" still work this long without "hey"
  sleep_phrases: ["go to sleep", "sleep", "that's all", "stop listening", "never mind", "stop", "jarvis stop"]

listen:
  start_timeout_seconds: 5   # give up if you don't start talking within this time
  end_silence_ms: 1200       # pause this long and your sentence is done (lower = snappier, higher = fewer cut-offs)
  max_seconds: 15            # longest command
  wake_max_seconds: 6        # longest phrase checked for "hey" (background chatter gets cut off)
  vad_aggressiveness: 3      # 0-3, higher filters more background noise
  noise_ratio: 2.5           # speech must be this many times louder than the background; raise if noisy
  min_level: 150             # ignore anything quieter than this (see the mic bar in python -m voice.wakeword)

stt:
  model: large-v3-turbo      # or distil-large-v3, small.en for slower PCs
  device: auto               # auto | cuda | cpu
  language: en               # en = fewer mistakes; hi for Hindi; null = auto-detect (noisier)
  beam_size: 1               # 1 = fastest, 5 = slightly more accurate
  hotwords: "open, Spotify, Chrome, YouTube, notepad, volume"  # app/command words to recognise better

logging:
  level: INFO
  file: logs/jarvis.log

brain:
  order: [claude, groq, local]   # tried in this order; missing keys or errors fall through
  max_tokens: 600                # room for the model's short reasoning plus the reply
  fast_actions: true             # speak "Opened Spotify" straight from the action, skipping a second model call
  timeout_seconds: 20
  max_tool_steps: 8              # tool calls allowed per request (multi-step app control needs more)
  history_turns: 10              # past exchanges kept for follow-ups
  history_reset_minutes: 10      # forget the conversation after this long idle
  providers:
    groq:
      model: openai/gpt-oss-20b    # fastest Groq model with reliable tool use; openai/gpt-oss-120b is smarter
      reasoning_effort: low
    claude:
      model: claude-haiku-5-5          # fast: everyday commands
      smart_model: claude-sonnet-5-5   # used for multi-step tasks, code, explanations
    local:
      model: llama3.1:8b         # any model pulled in Ollama
      base_url: http://localhost:11434/v1

typing:
  notch: true                 # thin pill at the top-center; hover it to open the bar
  notch_hover_ms: 150         # how long the mouse must rest on the notch before it opens
  hotkey: ctrl+alt+j          # also opens the bar; modifiers: ctrl, alt, shift, win
  stop_hotkey: ctrl+alt+k     # kill switch: stop talking, cancel pending action, sleep
  hide_on_focus_loss: true
  speak_replies: true         # also say typed replies out loud

security:
  max_tool_calls_per_minute: 30  # stops a runaway model loop
  redact_cloud: true             # scrub keys, card numbers, passwords before text goes to Groq/Claude
  blocked_domains: []            # e.g. ["example-bank.com"]; Jarvis will refuse to open them
  levels: {}                     # make a tool stricter, e.g. {screenshot: confirm, open_website: deny}
  audit_file: logs/audit.jsonl
  private_windows: [bitwarden, 1password, keepass, lastpass, dashlane, credential, windows security,
                    password, authenticator]   # Jarvis never reads, types into or clicks in these

overlay:
  enabled: true
  position: bottom-right   # bottom-right | bottom-center | center
  size: 220                # orb area in pixels
  show_captions: true      # show what was heard and the reply under the orb

vision:
  enabled: true                  # screenshots for "what's on my screen" and clicking things apps don't expose
  order: [groq, claude, local]   # first available vision model is used
  groq_model: qwen/qwen3.8-27b   # Groq's image model
  claude_model: claude-haiku-5-5
  local_model: qwen2.5vl:7b      # ollama pull qwen2.5vl:7b for offline vision

browser:
  channel: msedge        # msedge (always installed) or chrome; Jarvis uses its own profile in data/browser-profile

contacts:
  # Optional. With a number saved, messages open the exact chat (most reliable).
  # Without one, Jarvis searches the name in your WhatsApp chat list.
  # Example:
  # ram:
  #   whatsapp: "+91 98765 43210"
  #   aliases: [ram bhai, ramu]
  # mom:
  #   whatsapp: "+91 90000 00000"
  #   aliases: [mummy, maa]
  {}
